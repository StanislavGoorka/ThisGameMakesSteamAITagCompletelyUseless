name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows x64 (${{ matrix.preset }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release, windows-public-debug, windows-public-release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate asset payload
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Validate-AssetPackage.ps1
      - name: Test asset gate
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-AssetPackage.ps1
      - name: Test public content and build modes
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-PublicContent.ps1 -BuildModes
      - name: Configure
        run: |
          $configure = if ('${{ matrix.preset }}' -like 'windows-public-*') { 'windows-public' } else { 'windows-msvc' }
          cmake --preset $configure
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
